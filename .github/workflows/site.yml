name: Website

# Pull requests build and test the site. Pushes to main also publish it to
# GitHub Pages (Settings → Pages → Source: GitHub Actions). The site is built
# from the Markdown under workstreams/, so a change there rebuilds it.

on:
  push:
    branches: [main]
    paths:
      - workstreams/**
      - charter/charter.md
      - README.md
      - site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - workstreams/**
      - charter/charter.md
      - README.md
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the footer shows when the source Markdown last changed
      - name: Test
        run: node --test site/test/*.test.mjs
      - name: Build
        run: node site/build.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
